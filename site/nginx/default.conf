server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects keep a relative Location: an absolute one would carry :8080 behind the ingress.
    absolute_redirect off;

    # add_header is not inherited once a location sets its own: each location includes the shared file.
    include /etc/nginx/conf.d/security-headers.inc;

    error_page 404 /404.html;

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    location /_astro/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
}
